<!DOCTYPE html>

<head>
<script>
  // Detecta muy pronto si la app corre instalada (standalone) para saltar
  // el "toca para iniciar" del intro en esos casos.
  (function(){
    var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if(standalone){ document.documentElement.setAttribute('data-standalone','1'); }
  })();
</script>

<meta name="twitter:description" content="Chokokue Remiandú 95.1 FM, transmitiendo en vivo las 24 horas.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== Paleta de marca — extraída del logo Chokokue Remiandú ===== */
    --bg-0:#170b04;         /* fondo principal, marrón muy oscuro (casi negro, tono cálido) */
    --bg-1:#241206;         /* paneles / superficies ligeramente más claras */
    --orange:#c33101;       /* naranja-rojo del disco del logo */
    --orange-deep:#7a1f01;  /* naranja oscuro, para sombras/degradados */
    --gold:#e7a625;         /* dorado — "95.1FM" / "REMIANDU" del logo, color de acento principal */
    --gold-light:#f7d564;   /* dorado claro, brillos */
    --green:#61a228;        /* verde de la "C" — acento secundario */
    --green-dark:#225d1e;
    --cream:#f8e4a6;        /* crema — "HOKOKUE" del logo */
    --ink:#f6efe2;          /* texto principal, blanco cálido */
    --ink-dim:#c9b79a;      /* texto secundario, tono arena apagado */
    --line:#3a2313;         /* líneas divisorias */
    --mini-h:74px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    position:fixed;
    inset:0;
    width:100%;
  }

  body{
    background:var(--bg-0);
    color:var(--ink);
    font-family:'Archivo',sans-serif;
    touch-action:pan-x;
  }

  button{font-family:inherit;}
  img{-webkit-user-drag:none;user-select:none;}

  /* ============================================================
     SPLASH / INTRO — video de bienvenida con sonido (el "pisador")
  ============================================================ */
  #splash-screen{
    position:fixed;inset:0;z-index:999;
    background:var(--bg-0);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    transition:opacity .55s ease, visibility .55s ease;
  }
  #splash-screen.hide{opacity:0;visibility:hidden;pointer-events:none;}

  .splash-video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;object-position:center;
    background:var(--bg-0);
  }

  /* Velo sutil para que el "toca para iniciar" resalte sobre el video */
  .splash-scrim{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(23,11,4,.25) 0%, rgba(23,11,4,.05) 30%, rgba(23,11,4,.55) 100%);
  }

  /* Overlay "toca para iniciar" — necesario porque los navegadores
     bloquean audio/video con sonido si no hay un toque/click del usuario */
  .tap-overlay{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;
    background:rgba(23,11,4,.55);
    backdrop-filter:blur(2px);
    cursor:pointer;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .3s ease, visibility .3s ease;
  }
  .tap-overlay.show{opacity:1;visibility:visible;pointer-events:auto;}
  .tap-pulse{
    width:64px;height:64px;border-radius:50%;
    background:rgba(231,166,37,.18);
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    animation:tap-pulse-anim 1.6s ease-in-out infinite;
  }
  .tap-pulse svg{width:26px;height:26px;color:var(--gold);}
  @keyframes tap-pulse-anim{
    0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(231,166,37,.5);}
    50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(231,166,37,0);}
  }
  .tap-label{
    font-family:'Archivo Black',sans-serif;
    font-size:14px;letter-spacing:.06em;color:var(--ink);
    text-transform:uppercase;
  }

  /* ============================================================
     VISTA 1 — INICIO (portada a pantalla completa, video de fondo)
  ============================================================ */
  #home-view{
    position:fixed;
    inset:0;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:
      linear-gradient(180deg, rgba(23,11,4,.20) 0%, rgba(23,11,4,.65) 58%, var(--bg-0) 92%),
      radial-gradient(120% 70% at 78% 18%, rgba(195,49,1,.35), transparent 60%);
    padding-bottom: calc(var(--mini-h) + var(--safe-b));
    padding-top: var(--safe-t);
    overflow:hidden;
  }

  /* Video de fondo a pantalla completa: muteado, en loop y difuminado */
  .hero-video{
    position:absolute;
    inset:0;
    z-index:0;
    width:110%;
    height:110%;
    left:-5%;
    top:-5%;
    object-fit:cover;
    object-position:center;
    opacity:.85;
    filter:blur(9px) saturate(1.15) brightness(.85);
  }
  /* Overlay de color difuminado sobre el video, con los tonos del logo */
  .hero-color-overlay{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(90% 60% at 50% 100%, rgba(195,49,1,.55) 0%, rgba(195,49,1,0) 65%),
      linear-gradient(180deg, rgba(231,166,37,.22) 0%, rgba(23,11,4,0) 45%);
    mix-blend-mode:screen;
  }
  .grain{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, transparent 2px 46px);
  }

  header{
    position:relative;z-index:3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:22px clamp(20px,5vw,64px);
    gap:12px;
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:10px;min-width:0;}
  .brand-mark{
    width:44px;height:44px;border-radius:50%;background:var(--bg-1);
    border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:13px;flex-shrink:0;
    overflow:hidden;
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;}
  .brand-name{font-family:'Archivo Black',sans-serif;font-size:15px;letter-spacing:.02em;white-space:nowrap;}

  /* Botón instalar PWA */
  #install-btn{
    display:none;
    align-items:center;gap:8px;
    padding:10px 16px;border-radius:999px;
    background:var(--gold);color:var(--bg-0);
    font-weight:800;font-size:12.5px;letter-spacing:.02em;
    border:none;cursor:pointer;flex-shrink:0;
    box-shadow:0 10px 24px -10px rgba(231,166,37,.8);
    transition:transform .15s ease;
    white-space:nowrap;
  }
  #install-btn:active{transform:scale(.95);}
  #install-btn svg{width:16px;height:16px;flex-shrink:0;}
  #install-btn.show{display:inline-flex;}

  .hero{
    position:relative;z-index:3;
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    gap:14px;
    padding:24px clamp(20px,6vw,64px) 26px;
    min-height:0;
  }

  .live-pill{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 18px 8px 14px;border-radius:999px;
    background:var(--gold);
    font-size:13px;letter-spacing:.03em;color:var(--bg-0);font-weight:800;
    width:fit-content;
  }
  .live-dot{
    width:8px;height:8px;border-radius:50%;background:var(--bg-0);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(23,11,4,.55);}
    70%{box-shadow:0 0 0 9px rgba(23,11,4,0);}
    100%{box-shadow:0 0 0 0 rgba(23,11,4,0);}
  }

  .hero h1{
    font-family:'Archivo Black',sans-serif;
    font-size:clamp(30px,8vw,46px);
    letter-spacing:.005em;
    line-height:1.02;
    max-width:14ch;
  }
  .hero h1 .accent{color:var(--green);}
  .hero p.tagline{color:var(--ink-dim);font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}

  .social-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px;}
  .social-row a{
    width:42px;height:42px;border-radius:50%;
    background:rgba(246,239,226,.06);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);text-decoration:none;
    transition:border-color .2s,color .2s,transform .15s,background .2s;
  }
  .social-row a:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px);}
  .social-row svg{width:18px;height:18px;}

  /* ---- Mini reproductor (barra fija inferior, funcional) ---- */
  #mini-bar{
    position:fixed;
    left:0;right:0;
    bottom:0;
    height:calc(var(--mini-h) + var(--safe-b));
    padding-bottom:var(--safe-b);
    background:#1d0f06;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:14px;
    padding-left:16px;padding-right:16px;
    cursor:pointer;
    z-index:20;
    box-shadow:0 -8px 30px -10px rgba(0,0,0,.5);
  }
  #mini-bar .mini-mark{
    width:44px;height:44px;border-radius:50%;flex-shrink:0;
    background:var(--bg-0);border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:10px;
    overflow:hidden;
  }
  #mini-bar .mini-mark img{width:100%;height:100%;object-fit:cover;}
  #mini-bar .mini-mark.spinning{animation:spin 9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .mini-info{flex:1;min-width:0;overflow:hidden;}
  .mini-marquee{white-space:nowrap;}
  .mini-info .t1{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-info .t2{font-size:12px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Ecualizador animado */
  .eq{display:flex;align-items:flex-end;gap:3px;height:22px;flex-shrink:0;}
  .eq span{
    width:3px;border-radius:2px;background:var(--green);
    animation:eqbar 1s ease-in-out infinite;
    height:6px;
  }
  .eq.paused span{animation-play-state:paused;height:4px;background:var(--ink-dim);}
  .eq span:nth-child(1){animation-duration:.8s;animation-delay:0s;}
  .eq span:nth-child(2){animation-duration:1.1s;animation-delay:.1s;}
  .eq span:nth-child(3){animation-duration:.7s;animation-delay:.15s;}
  .eq span:nth-child(4){animation-duration:1s;animation-delay:.05s;}
  .eq span:nth-child(5){animation-duration:.9s;animation-delay:.2s;}
  @keyframes eqbar{
    0%,100%{height:5px;}
    50%{height:22px;}
  }

  #mini-play{
    width:40px;height:40px;border-radius:50%;flex-shrink:0;
    background:var(--gold);border:none;color:var(--bg-0);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  #mini-play svg{width:16px;height:16px;}

  #mini-vol-btn{
    width:36px;height:36px;border-radius:50%;flex-shrink:0;
    background:none;border:none;color:var(--ink-dim);cursor:pointer;
    display:none;align-items:center;justify-content:center;
  }
  #mini-vol-btn svg{width:18px;height:18px;}
  @media(min-width:480px){ #mini-vol-btn{display:flex;} }

  /* ============================================================
     VISTA 2 — REPRODUCTOR A PANTALLA COMPLETA
  ============================================================ */
  #player-view{
    position:fixed;
    inset:0;
    background:var(--bg-0);
    z-index:50;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform .38s cubic-bezier(.4,0,.2,1);
    overflow-y:auto;
    overscroll-behavior:contain;
    padding-top:var(--safe-t);
  }
  #player-view.open{transform:translateY(0);}

  .player-top{
    display:flex;align-items:center;
    padding:18px clamp(18px,5vw,40px);
  }
  #back-btn{
    background:none;border:none;color:var(--ink);cursor:pointer;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;transition:background .15s;
  }
  #back-btn:hover{background:rgba(246,239,226,.06);}
  #back-btn svg{width:22px;height:22px;}

  /* ============================================================
     MENÚ DE SALIDA — aparece al pulsar el botón "atrás" de Android
     en la app instalada (PWA), para elegir qué hacer con el audio.
  ============================================================ */
  #exit-menu{
    position:fixed;inset:0;z-index:900;
    background:rgba(23,11,4,.72);
    backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;
    opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity .25s ease, visibility .25s ease;
  }
  #exit-menu.show{opacity:1;visibility:visible;pointer-events:auto;}
  .exit-sheet{
    width:100%;max-width:480px;
    background:var(--bg-1);
    border:1px solid var(--line);
    border-radius:20px 20px 0 0;
    padding:22px clamp(18px,5vw,28px) calc(22px + var(--safe-b));
    display:flex;flex-direction:column;gap:10px;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.4,0,.2,1);
  }
  #exit-menu.show .exit-sheet{transform:translateY(0);}
  .exit-sheet h3{
    font-family:'Archivo Black',sans-serif;font-size:16px;
    margin-bottom:6px;color:var(--ink);
  }
  .exit-sheet p{color:var(--ink-dim);font-size:13px;margin-bottom:8px;}
  .exit-option{
    display:flex;align-items:center;gap:12px;
    width:100%;text-align:left;
    padding:14px 16px;border-radius:14px;
    background:var(--bg-0);border:1px solid var(--line);
    color:var(--ink);font-size:14px;font-weight:600;
    cursor:pointer;transition:background .15s,transform .15s;
  }
  .exit-option:active{transform:scale(.98);}
  .exit-option.primary{background:var(--gold);color:var(--bg-0);border-color:var(--gold);}
  .exit-option.danger{color:var(--orange);}
  .exit-option svg{width:20px;height:20px;flex-shrink:0;}
  .exit-cancel{
    margin-top:4px;padding:14px;border-radius:14px;
    background:none;border:none;color:var(--ink-dim);
    font-size:14px;font-weight:600;cursor:pointer;text-align:center;
  }

  .player-body{
    flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;gap:22px;
    padding:10px 24px 50px;
  }

  .disc-wrap{position:relative;width:min(60vw,270px);aspect-ratio:1/1;}
  .disc{
    width:100%;height:100%;border-radius:50%;
    background:conic-gradient(from 220deg, var(--bg-1), #2c1608 30%, var(--bg-1) 55%, #291406 80%, var(--bg-1));
    border:6px solid #33190c;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 30px 60px -20px rgba(231,166,37,.35), inset 0 0 0 1px rgba(246,239,226,.03);
  }
  .disc.spinning{animation:spin 9s linear infinite;}
  .disc-core{
    width:44%;height:44%;border-radius:50%;background:var(--bg-0);
    border:3px solid var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-family:'Archivo Black',sans-serif;font-size:clamp(15px,4vw,20px);
    overflow:hidden;
  }
  .disc-core img{width:100%;height:100%;object-fit:cover;}

  .station-info h1{font-family:'Archivo Black',sans-serif;font-size:clamp(22px,5.5vw,30px);}
  .station-info p{margin-top:6px;color:var(--ink-dim);font-size:14px;}

  #track-title{font-size:13px;color:var(--green);font-weight:600;min-height:16px;letter-spacing:.02em;}

  .on-air-banner{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 22px;border-radius:999px;
    background:var(--gold);color:var(--bg-0);
    font-weight:800;font-size:13px;letter-spacing:.04em;
  }

  .controls{display:flex;align-items:center;justify-content:center;gap:26px;}
  .btn-round{
    background:none;border:none;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s ease,color .15s ease;
  }
  .btn-round:hover{color:var(--gold);}
  .btn-round:active{transform:scale(.92);}
  #play-btn{
    width:76px;height:76px;border-radius:50%;background:var(--gold);color:var(--bg-0);
    box-shadow:0 12px 30px -10px rgba(231,166,37,.7);
  }
  #play-btn:hover{color:var(--bg-0);transform:scale(1.04);}
  #play-btn svg{width:28px;height:28px;}
  .btn-small svg{width:22px;height:22px;}

  .volume-row{display:flex;align-items:center;gap:10px;width:100%;max-width:220px;}
  input[type=range]{
    -webkit-appearance:none;width:100%;height:4px;border-radius:4px;
    background:var(--line);outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--green);border:2px solid var(--bg-0);box-shadow:0 0 0 1px var(--green);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;background:var(--green);
    border:2px solid var(--bg-0);cursor:pointer;
  }

  #status-msg{font-size:12px;color:var(--ink-dim);min-height:14px;}

  @media (max-width:420px){
    header{padding:16px 16px;}
    .hero{gap:12px;padding-bottom:20px;}
    .controls{gap:18px;}
    #install-btn span{display:none;}
    #install-btn{padding:10px;width:38px;height:38px;justify-content:center;border-radius:50%;}
  }

  /* Pantallas muy bajas (móviles pequeños en horizontal, etc.) */
  @media (max-height:640px){
    .hero h1{font-size:clamp(24px,7vw,34px);}
    .social-row a{width:38px;height:38px;}
    header{padding-top:14px;padding-bottom:8px;}
  }
</style>
</head>
<body>

<!-- ============ SPLASH / INTRO (video con sonido) ============ -->
<div id="splash-screen">
  <video id="intro-video" class="splash-video" playsinline webkit-playsinline preload="auto" poster="media/poster.jpg">
    <source src="media/intro.mp4" type="video/mp4">
  </video>
  <div class="splash-scrim"></div>
  <div id="tap-to-start" class="tap-overlay">
    <div class="tap-pulse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74"/><path d="M14 10.5V6a2.5 2.5 0 0 1 5 0v8a7 7 0 0 1-7 7h-1a7 7 0 0 1-6.29-3.94l-1.7-3.4a2 2 0 0 1 3.6-1.8L7 14"/></svg>
    </div>
    <div class="tap-label">Toca para iniciar</div>
  </div>
</div>

<!-- ============ VISTA 1: INICIO ============ -->
<div id="home-view">

  <video class="hero-video" autoplay muted loop playsinline aria-hidden="true" poster="media/poster.jpg">
    <source src="media/intro.mp4" type="video/mp4">
  </video>
  <div class="hero-color-overlay"></div>
  <div class="grain"></div>

  <header>
    <div class="brand">
      <div class="brand-mark"><img src="icons/icon-192.png" alt="Chokokue Remiandú"></div>

<div id="exit-menu">
  <div class="exit-sheet">

<script>
  /* ================================================================
     CONFIGURACIÓN — edita aquí la URL del stream y las redes sociales
     ================================================================ */
  const CONFIG = {
    STREAM_URL: "https://fpsnew2.listen2myradio.com:2199/listen.php?ip=212.84.160.3&port=6198&type=ice&mount=stream",
    STATION_NAME: "Chokokue Remiandú",
    SOCIAL: {
      facebook:  "https://www.facebook.com/share/14p5ARmJwGt/",
      whatsapp:  "https://wa.me/595987405332",
      tiktok:    "https://www.tiktok.com/@chococueremiandu?_r=1&_t=ZN-99bMSu1aKJy"
    }
  };

  // Aplica las URLs de redes sociales configuradas arriba
  document.querySelectorAll('#social-row a[data-social]').forEach(a => {
    const url = CONFIG.SOCIAL[a.dataset.social];
    if (url) a.href = url;
  });

  const audio        = document.getElementById('audio');

  const playerView   = document.getElementById('player-view');
  const backBtn      = document.getElementById('back-btn');
  const playBtn      = document.getElementById('play-btn');
  const playIcon     = document.getElementById('play-icon');
  const pauseIcon    = document.getElementById('pause-icon');
  const muteBtn      = document.getElementById('mute-btn');
  const volSlider    = document.getElementById('volume');
  const reloadBtn    = document.getElementById('reload-btn');
  const disc         = document.getElementById('disc');
  const statusMsg    = document.getElementById('status-msg');
  const trackTitle   = document.getElementById('track-title');

  const miniBar         = document.getElementById('mini-bar');
  const miniPlay         = document.getElementById('mini-play');
  const miniPlayIcon     = document.getElementById('mini-play-icon');
  const miniPauseIcon    = document.getElementById('mini-pause-icon');
  const miniMark         = document.getElementById('mini-mark');
  const miniSubtitle     = document.getElementById('mini-subtitle');
  const miniEq           = document.getElementById('mini-eq');
  const miniVolBtn       = document.getElementById('mini-vol-btn');

  audio.volume = 0.8;

  function openPlayerView(){
    playerView.classList.add('open');
  }
  function closePlayerView(){
    playerView.classList.remove('open');
  }

  miniBar.addEventListener('click', (e) => {
    if(e.target.closest('#mini-play')){
      togglePlay();
      return;
    }
    if(e.target.closest('#mini-vol-btn')){
      toggleMute();
      return;
    }
    openPlayerView();
  });

  backBtn.addEventListener('click', closePlayerView);

  function setPlayingUI(isPlaying){
    playIcon.style.display      = isPlaying ? 'none'  : 'block';
    pauseIcon.style.display     = isPlaying ? 'block' : 'none';
    miniPlayIcon.style.display  = isPlaying ? 'none'  : 'block';
    miniPauseIcon.style.display = isPlaying ? 'block' : 'none';
    disc.classList.toggle('spinning', isPlaying);
    miniMark.classList.toggle('spinning', isPlaying);
    miniEq.classList.toggle('paused', !isPlaying);
  }

  // Evita que el navegador reutilice una conexión vieja/fallida en caché:
  // cada vez que cargamos el stream le agregamos un parámetro único.
  function freshStreamUrl(){
    const sep = CONFIG.STREAM_URL.includes('?') ? '&' : '?';
    return CONFIG.STREAM_URL + sep + '_=' + Date.now();
  }

  function loadStream(){
    if(!CONFIG.STREAM_URL){
      statusMsg.textContent = 'Sin transmisión configurada';
      trackTitle.textContent = 'Agrega la URL del stream en CONFIG.STREAM_URL';
      return false;
    }
    audio.src = freshStreamUrl();
    audio.load();
    return true;
  }

  function attemptPlay(isRetry){
    audio.play()
      .then(() => {
        statusMsg.textContent = 'Transmitiendo en vivo';
        trackTitle.textContent = CONFIG.STATION_NAME + ' — En Vivo';
        miniSubtitle.textContent = 'Sonando en vivo';
        setPlayingUI(true);
      })
      .catch(() => {
        if(!isRetry){
          // Primer intento falló (a veces por una conexión en caché) —
          // reintenta una vez de inmediato con una URL nueva antes de rendirse.
          statusMsg.textContent = 'Reintentando…';
          miniSubtitle.textContent = 'Reintentando…';
          loadStream();
          setTimeout(() => attemptPlay(true), 400);
        } else {
          statusMsg.textContent = 'No se pudo conectar al stream';
          miniSubtitle.textContent = 'No se pudo conectar';
          if(wantsPlaying) scheduleReconnect();
        }
      });
  }

  // wantsPlaying = intención del usuario (true = quiere estar escuchando).
  // Se usa para saber si, ante un corte de conexión, hay que reconectar
  // solo o esperar a que el usuario pulse play de nuevo.
  let wantsPlaying = false;

  function togglePlay(){
    if(audio.paused){
      wantsPlaying = true;
      loadStream();
      statusMsg.textContent = 'Conectando…';
      miniSubtitle.textContent = 'Conectando…';
      attemptPlay(false);
    } else {
      wantsPlaying = false;
      cancelReconnect();
      audio.pause();
      statusMsg.textContent = 'Pausado';
      miniSubtitle.textContent = 'Pausado';
      setPlayingUI(false);
    }
  }

  playBtn.addEventListener('click', togglePlay);
  // OJO: mini-play y mini-vol-btn YA se manejan dentro del listener
  // delegado de #mini-bar (más abajo). No agregar aquí un segundo
  // listener directo sobre ellos: al estar dentro de #mini-bar, un
  // solo toque disparaba togglePlay()/toggleMute() DOS veces (una por
  // el listener directo y otra por el delegado), lo que causaba que
  // al pausar, se reprodujera otra vez de inmediato.

  reloadBtn.addEventListener('click', () => {
    const wasPlaying = !audio.paused || wantsPlaying;
    cancelReconnect();
    audio.pause();
    setPlayingUI(false);
    if(loadStream() && wasPlaying){
      wantsPlaying = true;
      statusMsg.textContent = 'Reconectando…';
      miniSubtitle.textContent = 'Reconectando…';
      attemptPlay(false);
    }
  });

  volSlider.addEventListener('input', (e) => {
    audio.volume = e.target.value / 100;
    audio.muted = false;
  });

  let lastVolume = 80;
  function toggleMute(){
    if(audio.muted || audio.volume === 0){
      audio.muted = false;
      audio.volume = lastVolume / 100;
      volSlider.value = lastVolume;
    } else {
      lastVolume = volSlider.value;
      audio.muted = true;
      audio.volume = 0;
      volSlider.value = 0;
    }
  }
  muteBtn.addEventListener('click', toggleMute);
  // miniVolBtn se maneja en el listener delegado de #mini-bar (ver abajo)

  /* ================================================================
     RECONEXIÓN AUTOMÁTICA — si se corta el streaming (o se va y
     vuelve el internet) y la radio estaba sonando, se reconecta sola
     sin que el usuario tenga que tocar play de nuevo.
     ================================================================ */
  let reconnectTimer  = null;
  let waitingTimer     = null;
  let reconnectAttempts = 0;

  function cancelReconnect(){
    if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
    if(waitingTimer){ clearTimeout(waitingTimer); waitingTimer = null; }
    reconnectAttempts = 0;
  }

  function scheduleReconnect(){
    if(!wantsPlaying || reconnectTimer) return;
    reconnectAttempts++;
    const delay = Math.min(2500 * reconnectAttempts, 15000);
    statusMsg.textContent = 'Se cortó la señal, reconectando…';
    miniSubtitle.textContent = 'Reconectando…';
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if(!wantsPlaying) return;
      loadStream();
      attemptPlay(false);
    }, delay);
  }

  audio.addEventListener('waiting', () => {
    statusMsg.textContent = 'Cargando…';
    // Si se queda "cargando" demasiado tiempo sin arrancar, asumimos
    // que la conexión se cortó y forzamos una reconexión.
    if(waitingTimer) clearTimeout(waitingTimer);
    waitingTimer = setTimeout(() => {
      if(wantsPlaying) scheduleReconnect();
    }, 8000);
  });

  audio.addEventListener('playing', () => {
    statusMsg.textContent = 'Transmitiendo en vivo';
    if(waitingTimer){ clearTimeout(waitingTimer); waitingTimer = null; }
    reconnectAttempts = 0;
  });

  // El elemento <audio> dispara 'error' o 'stalled' cuando la conexión
  // del stream se corta de golpe (se va la señal / el internet).
  audio.addEventListener('error', () => { if(wantsPlaying) scheduleReconnect(); });
  audio.addEventListener('stalled', () => { if(wantsPlaying) scheduleReconnect(); });
  audio.addEventListener('ended', () => { if(wantsPlaying) scheduleReconnect(); });

  // Cuando el navegador detecta que volvió el internet, reconectamos
  // de inmediato en vez de esperar el temporizador.
  window.addEventListener('online', () => {
    if(!wantsPlaying) return;
    cancelReconnect();
    loadStream();
    attemptPlay(false);
  });

  // Al volver a primer plano (el usuario reabre la app/pestaña) revisamos
  // si el audio quedó "colgado" y reconectamos si hace falta.
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && wantsPlaying && audio.paused){
      cancelReconnect();
      loadStream();
      attemptPlay(false);
    }
  });

  /* ================================================================
     BLOQUEO DE SCROLL / REBOTE — asegura que la pantalla de inicio
     nunca se pueda deslizar hacia abajo en navegadores móviles.
     El reproductor de pantalla completa sí permite scroll interno
     por si el contenido no cabe en pantallas muy pequeñas.
     ================================================================ */
  document.addEventListener('touchmove', (e) => {
    if(!e.target.closest('#player-view') && !e.target.closest('input[type=range]')){
      e.preventDefault();
    }
  }, { passive:false });

  /* ================================================================
     SPLASH / INTRO — reproduce el video de bienvenida (con el sonido
     del "pisador") y entra al sitio cuando termina.

     - Los navegadores bloquean audio/video con sonido sin un gesto
       del usuario, así que mostramos "toca para iniciar" primero.
     - Si la app ya está instalada (modo standalone / abierta desde
       el ícono en el móvil), saltamos ese botón e intentamos
       reproducir directo; si el navegador igual lo bloquea, el botón
       aparece como respaldo.
     ================================================================ */
  const splash       = document.getElementById('splash-screen');
  const tapToStart    = document.getElementById('tap-to-start');
  const introVideo    = document.getElementById('intro-video');
  const isStandalone  = document.documentElement.getAttribute('data-standalone') === '1';

  let introFinished = false;
  function hideSplash(){
    if(introFinished) return;
    introFinished = true;
    splash.classList.add('hide');
  }

  function playIntro(){
    introVideo.currentTime = 0;
    introVideo.muted = false;
    const playPromise = introVideo.play();
    if(playPromise && playPromise.catch){
      playPromise
        .then(() => { tapToStart.classList.remove('show'); })
        .catch(() => {
          // El navegador igual bloqueó el video con sonido: mostramos
          // el botón como respaldo para que el usuario dé el toque
          // necesario.
          tapToStart.classList.add('show');
        });
    } else {
      tapToStart.classList.remove('show');
    }
  }

  introVideo.addEventListener('ended', hideSplash);
  introVideo.addEventListener('error', hideSplash);

  tapToStart.addEventListener('click', () => {
    tapToStart.classList.remove('show');
    playIntro();
  });

  if(isStandalone){
    playIntro();
  } else {
    tapToStart.classList.add('show');
  }

  // Respaldo: si algo falla (video no carga, no dispara "ended", etc.)
  // no dejamos al usuario atascado en el splash.
  setTimeout(hideSplash, 12000);

  /* ================================================================
     PWA — instalación y service worker
     ================================================================ */
  const installBtn = document.getElementById('install-btn');
  let deferredPrompt = null;

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('show');
  });

  installBtn.addEventListener('click', async () => {
    if(!deferredPrompt) return;
    installBtn.classList.remove('show');
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  });

  window.addEventListener('appinstalled', () => {
    installBtn.classList.remove('show');
    deferredPrompt = null;
  });

  // Si ya corre instalada (standalone), no mostrar el botón
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    installBtn.classList.remove('show');
  }

  /* ================================================================
     BOTÓN "ATRÁS" DE ANDROID EN LA APP INSTALADA (PWA)
     Antes: un solo toque en la flecha de "salir" cortaba la radio.
     Ahora: si la radio está sonando, aparece un menú para elegir
     entre seguir en la app, salir dejando la radio sonando, o salir
     deteniéndola.
     ================================================================ */
  const exitMenu       = document.getElementById('exit-menu');
  const btnKeepApp      = document.getElementById('exit-keep-listening');
  const btnExitPlaying  = document.getElementById('exit-and-play');
  const btnExitStop     = document.getElementById('exit-and-stop');
  const btnExitCancel   = document.getElementById('exit-cancel-btn');

  let exitConfirmed = false;

  function openExitMenu(){ exitMenu.classList.add('show'); }
  function closeExitMenu(){ exitMenu.classList.remove('show'); }

  function confirmExit(stopAudio){
    if(stopAudio){
      wantsPlaying = false;
      cancelReconnect();
      audio.pause();
      setPlayingUI(false);
    }
    closeExitMenu();
    exitConfirmed = true;
    // Consumimos el "peldaño" extra de historial que agregamos; esto
    // deja el historial como estaba antes del toque en "atrás", así
    // que el próximo toque en "atrás" sí cierra la app de verdad.
    history.back();
  }

  btnKeepApp.addEventListener('click', closeExitMenu);
  btnExitCancel.addEventListener('click', closeExitMenu);
  btnExitPlaying.addEventListener('click', () => confirmExit(false));
  btnExitStop.addEventListener('click', () => confirmExit(true));

  if (isStandalone) {
    // Agregamos un estado extra al historial para poder "atrapar" el
    // primer toque en "atrás" y mostrar el menú en lugar de cerrar
    // la app de inmediato.
    history.pushState({ chokokueGuard: true }, '');

    window.addEventListener('popstate', () => {
      if (exitConfirmed) {
        // El usuario ya eligió una opción del menú: dejamos que la
        // salida ocurra con normalidad.
        exitConfirmed = false;
        return;
      }
      if (!audio.paused || wantsPlaying) {
        // Reponemos el estado para que la app no se cierre todavía,
        // y mostramos el menú de opciones.
        history.pushState({ chokokueGuard: true }, '');
        openExitMenu();
      } else {
        // La radio no está sonando: dejamos que la app se cierre
        // de una sola vez, sin mostrar el menú.
        exitConfirmed = true;
        history.back();
      }
    });
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        // Revisa si hay una nueva versión disponible y la activa de inmediato
        reg.addEventListener('updatefound', () => {
          const newWorker = reg.installing;
          newWorker.addEventListener('statechange', () => {
            if (newWorker.state === 'activated') {
              // La nueva versión ya está activa; el próximo reload la usará
            }
          });
        });
      }).catch(err => console.warn('SW registration failed:', err));
    });

    // Si el service worker cambia (nueva versión tomó control), recarga una vez
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  }
</script>
